<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#291b17"><title>Muzyka na poddaszu — kameralne koncerty domowe</title>
<meta name="description" content="Muzyka na poddaszu — kameralne koncerty domowe w Żyrardowie. Nie mamy sceny. Mamy poddasze.">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#281a18;color:#f9ebd4;font:17px/1.65 Georgia,serif}button,a{font:inherit}a{color:inherit}button{cursor:pointer}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}
/* Zachowujemy oryginalną, zaakceptowaną ilustrację wyłącznie na stronie głównej. */
.visual{position:relative;max-width:1055px;margin:auto}.visual>img{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;border-radius:8px;outline-offset:3px}.hotspot:focus-visible{outline:3px solid #fff}.nav-about{left:42.5%;top:1.1%;width:9%;height:3%}.nav-concerts{left:51%;top:1.1%;width:11%;height:3%}.nav-archive{left:62%;top:1.1%;width:12%;height:3%}.nav-gallery{left:73%;top:1.1%;width:10%;height:3%}.nav-guestbook{left:81%;top:1.1%;width:10%;height:3%}.nav-contact{left:89%;top:1.1%;width:11%;height:3%}.hero-go{left:4%;top:30%;width:24%;height:4%}.archive-go{left:6%;top:67%;width:88%;height:17%}
/* Osobny, czytelny nagłówek każdej podstrony: bez ponownego wyświetlania strony głównej. */
.site-header{max-width:1055px;margin:0 auto;background:#37231f;border-bottom:3px solid #bb9261;padding:17px clamp(15px,4vw,45px);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{text-decoration:none;color:#f5d8a2;font-size:clamp(19px,3vw,30px);font-weight:bold;letter-spacing:.015em}.brand small{display:block;color:#c8ab83;font:italic 12px Georgia,serif;letter-spacing:.06em}.site-nav{display:flex;flex-wrap:wrap;gap:8px 17px}.site-nav a{font-size:14px;text-decoration:none;color:#f2ddb9;border-bottom:1px solid transparent}.site-nav a:hover,.site-nav a:focus-visible{border-color:#dabb81}.site-nav a[aria-current="page"]{color:#fff;border-color:#dabb81}
.page{max-width:1055px;margin:0 auto;min-height:520px;padding:50px clamp(20px,6vw,70px) 78px;background:#eadcc1;color:#492c25}.page.dark{background:#354439;color:#f7ead3}.page h1{font-size:clamp(31px,5vw,52px);line-height:1.15;margin:0 0 13px}.page h2{font-size:clamp(23px,3vw,32px);line-height:1.2}.page p{max-width:800px}.about-story{max-width:790px;font-size:18px;line-height:1.9}.about-story p{margin:0 0 1.4em}.about-story .about-lead{font-style:italic;color:#765443;font-size:20px}.about-story .about-signature{font-weight:bold;margin-top:2.5em}.subtitle{color:#866147;font-style:italic}.dark .subtitle{color:#e0c8a4}.line{width:95px;height:3px;background:#b68755;margin:20px 0 27px}.back-link{display:inline-flex;gap:7px;text-decoration:none;font-size:15px;color:#723d34;margin-bottom:28px}.dark .back-link{color:#f2d3a2}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:23px;margin-top:34px}.card{background:#f0ddbb;color:#44281f;border:5px solid #c6a376;box-shadow:0 8px 23px #14231b50}.card img{display:block;width:100%;height:285px;object-fit:contain;background:#251c19}.card-inner{padding:18px 20px 23px}.card h2{font-size:24px;margin:0 0 9px}.card .date{font-size:14px;color:#795d45}.read-more{display:inline-block;padding:9px 17px;background:#642f2a;border-radius:30px;text-decoration:none;color:#fff;margin-top:12px;font-size:15px}.read-more:hover{background:#7a4234}
.article-layout{display:grid;grid-template-columns:minmax(0,1fr) 225px;align-items:start;gap:38px}.article-poster{width:100%;height:auto;display:block;border:5px solid #ae8253;background:#241a18}.concert-description{white-space:pre-line;font-size:clamp(17px,2vw,19px);line-height:1.85;overflow-wrap:anywhere}.concert-description:empty{display:none}.date-line{font-size:16px;color:#8a5b3b;margin:6px 0 28px}.gallery-label{margin:35px 0 12px;font-size:19px;font-weight:bold}.gallery{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 28px}.gallery button{display:block;width:95px;height:85px;flex:0 0 95px;padding:0;border:2px solid #a87b54;border-radius:4px;background:#241b18;overflow:hidden;cursor:zoom-in}.gallery img{width:100%;height:100%;object-fit:cover;display:block}.gallery button:focus-visible{outline:3px solid #6c272a;outline-offset:3px}.video{width:100%;aspect-ratio:16/9;border:0;margin-top:20px}.posters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:26px;margin-top:28px}.posters figure{margin:0}.posters img{width:100%;max-height:430px;object-fit:contain;border:4px solid #ad855b;background:#2a1d1a}.posters figcaption{font-size:15px;margin-top:8px}.guest-intro{max-width:740px;font-size:19px;line-height:1.8}.guest-list{display:grid;gap:20px;margin-top:28px}.guest-entry{padding:22px 26px;border-left:5px solid #b58a55;background:#f8ebd4;box-shadow:0 4px 12px #42251d16}.guest-entry blockquote{margin:0 0 12px;white-space:pre-line;overflow-wrap:anywhere;font-size:18px;line-height:1.8}.guest-entry cite{font-style:normal;font-weight:bold;color:#704b34}.guest-entry time{color:#88674d;font-size:14px;margin-left:8px}.guest-callout{padding:22px 25px;margin:32px 0;background:#e2cba8;border-radius:5px;max-width:800px}.guest-callout h2{margin:0 0 8px}.guest-callout p{margin:8px 0 15px}.action-link{display:inline-block;background:#672f29;color:#fff;text-decoration:none;border-radius:25px;padding:10px 18px}.action-link:hover,.action-link:focus-visible{background:#833f35}.contact-lines{padding:22px 0;max-width:740px}.contact-lines a{color:#6b342e;text-underline-offset:4px;overflow-wrap:anywhere}.contact-note{max-width:690px;color:#765743;font-size:15px}.footer{max-width:1055px;margin:auto;padding:23px;text-align:center;background:#281a18;font-size:14px;color:#d6b892}
.lightbox{border:0;padding:0;width:100%;height:100%;max-width:100%;max-height:100%;background:#160e0ceb;color:#fff}.lightbox::backdrop{background:#0c0808ec}.lightbox-inner{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 65px 44px;gap:10px}.lightbox img{display:block;max-width:100%;max-height:calc(100% - 30px);object-fit:contain;min-height:0}.lightbox-controls{position:absolute;right:16px;top:12px}.lightbox button{background:#f1ddbe;color:#311b18;border:0;border-radius:6px;min-width:44px;min-height:44px;font-size:21px}.lightbox-prev,.lightbox-next{position:absolute;top:50%;transform:translateY(-50%)}.lightbox-prev{left:8px}.lightbox-next{right:8px}.lightbox-caption{font-size:14px;text-align:center;color:#f1ddbe}.lightbox button:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media(max-width:700px){.article-layout{grid-template-columns:1fr}.article-poster{width:min(100%,270px);margin:0 auto}.page{padding-top:33px}.site-header{display:block}.site-nav{margin-top:13px}.lightbox-inner{padding:65px 48px 50px}}
</style></head><body>
<section id="homepage" hidden><div class="visual"><img src="assets/projekt-strony.png" alt="Ilustrowana strona główna Muzyki na poddaszu: kameralny koncert, Yoko i Pixie, sroka i psychodeliczne ornamenty."><a class="hotspot nav-about" href="#o-nas" aria-label="O nas"></a><a class="hotspot nav-concerts" href="#koncerty" aria-label="Koncerty"></a><a class="hotspot nav-archive" href="#archiwum" aria-label="Archiwum"></a><a class="hotspot nav-gallery" href="#galeria" aria-label="Galeria"></a><a class="hotspot nav-guestbook" href="#ksiega-gosci" aria-label="Księga gości"></a><a class="hotspot nav-contact" href="#kontakt" aria-label="Kontakt"></a><a class="hotspot hero-go" href="#archiwum" aria-label="Zobacz koncerty"></a><a class="hotspot archive-go" href="#archiwum" aria-label="Przejdź do archiwum"></a></div></section>
<header class="site-header" id="site-header" hidden><a class="brand" href="#start">Muzyka na poddaszu<small>Nie mamy sceny. Mamy poddasze.</small></a><nav class="site-nav" aria-label="Menu strony"><a href="#start">Start</a><a href="#o-nas">O nas</a><a href="#koncerty">Koncerty</a><a href="#archiwum">Archiwum</a><a href="#galeria">Galeria</a><a href="#ksiega-gosci">Księga gości</a><a href="#kontakt">Kontakt</a></nav></header>
<main id="page-root" hidden></main>
<footer class="footer" id="footer" hidden>Muzyka na poddaszu · Żyrardów · Z miłości do muzyki</footer>
<dialog class="lightbox" id="lightbox" aria-label="Powiększone zdjęcie koncertowe"><div class="lightbox-inner"><img id="lightbox-image" alt=""><div id="lightbox-caption" class="lightbox-caption" aria-live="polite"></div></div><div class="lightbox-controls"><button type="button" id="lightbox-close" aria-label="Zamknij">×</button></div><button type="button" id="lightbox-prev" class="lightbox-prev" aria-label="Poprzednie zdjęcie">‹</button><button type="button" id="lightbox-next" class="lightbox-next" aria-label="Następne zdjęcie">›</button></dialog>
<script>
const root=document.querySelector('#page-root'), home=document.querySelector('#homepage'), header=document.querySelector('#site-header'), footer=document.querySelector('#footer');
let site={concerts:[]};const file=s=>typeof s==='string'?(s.startsWith('/')?s.slice(1):s):'';
const el=(tag,content='',cls='')=>{const node=document.createElement(tag);node.textContent=content??'';if(cls)node.className=cls;return node};
const link=(label,href,cls='')=>{const a=el('a',label,cls);a.href=href;return a};
const slug=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const concerts=()=>Array.isArray(site.concerts)?site.concerts.filter(c=>c&&c.published!==false):[];
const dateText=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return '';const [y,m,day]=d.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,day,12));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1?new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(dt):d};
function newPage(title,dark=false){const section=el('section','','page'+(dark?' dark':''));section.append(el('h1',title),el('div','','line'));root.append(section);return section}
function renderArchive(){const section=newPage('Archiwum koncertów',true);section.append(el('p','Każde spotkanie ma tutaj własne miejsce — opowieść, plakat, zdjęcia i muzyka.','subtitle'));const grid=el('div','','cards');const items=concerts();if(!items.length)grid.append(el('p','Wspomnienia z naszych koncertów pojawią się tutaj.'));items.forEach((c,i)=>{const card=el('article','','card');if(c.poster){const img=el('img');img.src=file(c.poster);img.alt='Plakat koncertu: '+c.artist;img.loading='lazy';card.append(img)}const body=el('div','','card-inner');body.append(el('h2',c.artist||'Koncert'));if(c.date)body.append(el('p',dateText(c.date),'date'));body.append(link('Otwórz wspomnienie →','#koncert/'+encodeURIComponent(slug(c.artist)||String(i)),'read-more'));card.append(body);grid.append(card)});section.append(grid)}
function videoEmbed(u){
 try{
  const url=new URL(u);const host=url.hostname.toLowerCase().replace(/^www\./,'');
  if(host==='youtu.be'||host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com'){
   const id=host==='youtu.be'?url.pathname.split('/')[1]:url.pathname.startsWith('/shorts/')?url.pathname.split('/')[2]:url.pathname.startsWith('/embed/')?url.pathname.split('/')[2]:url.searchParams.get('v');
   return /^[\w-]{11}$/.test(id||'')?{src:'https://www.youtube-nocookie.com/embed/'+id,kind:'youtube'}:null;
  }
  if(host==='facebook.com'||host==='m.facebook.com'||host==='web.facebook.com'||host==='fb.watch'){
   if(url.protocol!=='https:')return null;
   const original=url.origin+url.pathname;return {src:'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(original)+'&show_text=false&width=500',kind:'facebook',url:original};
  }
 }catch(e){}
 return null;
}
const lightbox=document.querySelector('#lightbox'), lbImg=document.querySelector('#lightbox-image'),lbCap=document.querySelector('#lightbox-caption');let active=[],activeIndex=0,lastBtn=null;
function showPhoto(i){if(!active.length)return;activeIndex=(i+active.length)%active.length;lbImg.src=active[activeIndex].src;lbImg.alt=active[activeIndex].alt;lbCap.textContent=active[activeIndex].alt+' · '+(activeIndex+1)+' / '+active.length;document.querySelector('#lightbox-prev').hidden=active.length<2;document.querySelector('#lightbox-next').hidden=active.length<2}
function openPhoto(photos,index,trigger){active=photos;lastBtn=trigger;showPhoto(index);if(lightbox.showModal)lightbox.showModal();else lightbox.setAttribute('open','')}
function closePhoto(){if(lightbox.close&&lightbox.open)lightbox.close();else lightbox.removeAttribute('open');lbImg.removeAttribute('src');lastBtn?.focus()}
document.querySelector('#lightbox-close').onclick=closePhoto;document.querySelector('#lightbox-prev').onclick=()=>showPhoto(activeIndex-1);document.querySelector('#lightbox-next').onclick=()=>showPhoto(activeIndex+1);lightbox.addEventListener('click',e=>{if(e.target===lightbox)closePhoto()});lightbox.addEventListener('close',()=>{lbImg.removeAttribute('src');lastBtn?.focus()});lightbox.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();showPhoto(activeIndex-1)}if(e.key==='ArrowRight'){e.preventDefault();showPhoto(activeIndex+1)}});
function renderConcert(key){const c=concerts().find((c,i)=>(slug(c.artist)||String(i))===key);if(!c){const section=newPage('Nie znaleziono koncertu');section.append(link('← Wróć do archiwum','#archiwum','back-link'));return}const section=newPage(c.artist||'Koncert');section.insertBefore(link('← Wszystkie koncerty','#archiwum','back-link'),section.firstChild);if(c.date)section.append(el('p',dateText(c.date),'date-line'));const layout=el('div','','article-layout');const article=el('div');if(c.description)article.append(el('div',c.description,'concert-description'));else article.append(el('p','Wspomnienie z tego wieczoru jeszcze powstaje.'));if(Array.isArray(c.photos)&&c.photos.filter(Boolean).length){article.append(el('p','Galeria zdjęć (powiększ po kliknięciu)','gallery-label'));const photos=c.photos.filter(Boolean).map((p,i)=>({src:file(p),alt:'Zdjęcie '+(i+1)+' z koncertu: '+c.artist}));const gallery=el('div','','gallery');photos.forEach((photo,i)=>{const b=el('button');b.type='button';b.setAttribute('aria-label','Powiększ '+photo.alt);const img=el('img');img.src=photo.src;img.alt=photo.alt;img.loading='lazy';b.append(img);b.onclick=()=>openPhoto(photos,i,b);gallery.append(b)});article.append(gallery)}const vid=videoEmbed(c.video);if(vid){article.append(el('h2','Nagranie z koncertu'));const frame=el('iframe');frame.src=vid.src;frame.title='Film z koncertu';frame.className='video';frame.loading='lazy';frame.allowFullscreen=true;frame.setAttribute('allow','autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share');article.append(frame);if(vid.kind==='facebook'){article.append(link('Jeśli film się nie wyświetla, obejrzyj go na Facebooku ↗',vid.url,'back-link'))}}layout.append(article);if(c.poster){const aside=el('aside');const img=el('img','','article-poster');img.src=file(c.poster);img.alt='Plakat: '+c.artist;aside.append(img);layout.append(aside)}section.append(layout)}
function renderAbout(){
 const s=newPage('O nas');
 const story=el('div','','about-story');
 const full=(typeof site.about_full==='string'?site.about_full:'').trim();
 if(full){
   // Dwa znaki nowej linii rozdzielają akapity wpisane w Pages CMS.
   full.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).forEach((text,i)=>{
     const p=el('p',text.replace(/\n/g,' '));
     if(i===0)p.classList.add('about-lead');
     if(text.trim()==='Beata i Piotr')p.classList.add('about-signature');
     story.append(p);
   });
 }else{
   story.append(el('p',site.intro||'Muzyka na poddaszu to kameralne koncerty domowe w Żyrardowie.'));
   story.append(el('p',site.about||'Spotykamy się blisko, wśród książek, winyli i przyjaciół, bez sceny i pośpiechu.'));
 }
 s.append(story);
}
function renderGallery(){const s=newPage('Galeria plakatów');s.append(el('p','Ślady muzycznych spotkań na naszym poddaszu.','subtitle'));const grid=el('div','','posters');concerts().filter(c=>c.poster).forEach(c=>{const fig=el('figure');const a=link('','#koncert/'+encodeURIComponent(slug(c.artist)));const img=el('img');img.src=file(c.poster);img.alt='Plakat: '+c.artist;img.loading='lazy';a.append(img);fig.append(a,el('figcaption',c.artist));grid.append(fig)});s.append(grid)}
function renderGuests(){
 const s=newPage('Księga gości');
 s.append(el('p','Nie wszystkie wspomnienia mieszczą się na fotografiach. Niektóre zostają w słowach — tych, którzy byli tu z nami.','guest-intro'));
 const entries=Array.isArray(site.guestbook)?site.guestbook.filter(x=>x&&x.published!==false&&typeof x.text==='string'&&x.text.trim()):[];
 const list=el('div','','guest-list');
 if(entries.length){entries.slice().reverse().forEach(entry=>{const item=el('article','','guest-entry');item.append(el('blockquote',entry.text));const sign=el('div');sign.append(el('cite',entry.name?.trim()||'Gość poddasza'));if(/^\d{4}-\d{2}-\d{2}$/.test(entry.date||'')){const d=el('time',dateText(entry.date));d.dateTime=entry.date;sign.append(d)}item.append(sign);list.append(item)});}else list.append(el('p','Ta księga dopiero czeka na pierwsze wspomnienia.'));
 s.append(list);
 const callout=el('section','','guest-callout');callout.append(el('h2','Zostaw po sobie kilka słów'),el('p','Byłeś lub byłaś na naszym poddaszu? Chętnie zachowamy Twoje wspomnienie. Wpisy publikujemy po przeczytaniu i za zgodą autora.'));
 if(site.email&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(site.email)){
 const address='mailto:'+site.email+'?subject='+encodeURIComponent('Wpis do księgi gości — Muzyka na poddaszu')+'&body='+encodeURIComponent('Moje imię lub podpis: \n\nMoje wspomnienie: \n\nZgadzam się na publikację mojego podpisu i wspomnienia na stronie Muzyka na poddaszu: tak / nie');
 callout.append(link('Prześlij wspomnienie e-mailem ↗',address,'action-link'));
 callout.append(el('p','Przycisk otwiera Twój program pocztowy. Wiadomość nie jest publikowana automatycznie.','contact-note'));
 }else callout.append(el('p','Możliwość nadsyłania wspomnień uruchomimy po dodaniu adresu kontaktowego w panelu administracyjnym.','contact-note'));
 s.append(callout);
}
function renderContact(){
 const s=newPage('Kontakt');
 s.append(el('p','Chcesz do nas napisać? Porozmawiać o muzyce, wspomnieć któryś z wieczorów, a może po prostu się przywitać? Będzie nam miło.','guest-intro'));
 s.append(el('p','Muzyka na poddaszu · Żyrardów'));
 const lines=el('div','','contact-lines');let hasContact=false;
 if(site.email&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(site.email)){const p=el('p');p.append(el('strong','E-mail: '),link(site.email,'mailto:'+site.email));lines.append(p);hasContact=true}
 if(site.facebook&&/^https:\/\//.test(site.facebook)){const p=el('p');const a=link('Napisz do nas na Facebooku ↗',site.facebook);a.target='_blank';a.rel='noopener noreferrer';p.append(a);lines.append(p);hasContact=true}
 if(!hasContact)lines.append(el('p','Dane kontaktowe pojawią się tutaj, kiedy uzupełnimy je w panelu administracyjnym.'));
 s.append(lines,el('p','Koncerty odbywają się w prywatnym domu. Nie publikujemy jego adresu ani nie prowadzimy otwartej sprzedaży miejsc.','contact-note'));
}
function render(){const route=decodeURIComponent((location.hash||'#start').slice(1));const isHome=route===''||route==='start';home.hidden=!isHome;header.hidden=isHome;root.hidden=isHome;footer.hidden=isHome;root.replaceChildren();document.querySelectorAll('.site-nav a').forEach(a=>{if(a.hash.slice(1)===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(!isHome){if(route==='archiwum'||route==='koncerty')renderArchive();else if(route.startsWith('koncert/'))renderConcert(route.slice(8));else if(route==='o-nas')renderAbout();else if(route==='galeria')renderGallery();else if(route==='ksiega-gosci')renderGuests();else if(route==='kontakt')renderContact();else renderArchive()}document.title=(isHome?'Muzyka na poddaszu':(root.querySelector('h1')?.textContent||'Muzyka na poddaszu')+' — Muzyka na poddaszu');window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',render);render();fetch('data/site.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Nie można pobrać danych');return r.json()}).then(data=>{site=data;render()}).catch(()=>{if(location.hash&&location.hash!=='#start'){root.append(el('p','Nie udało się pobrać danych koncertów. Spróbuj odświeżyć stronę.'))}});
</script></body></html>
